version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
      test-and-qa:
        patterns:
          - "com.tngtech.archunit*"
          - "org.wiremock*"
          - "io.rest-assured*"
          - "org.testng*"
          - "io.qameta.allure*"
          - "io.gatling*"
  - package-ecosystem: maven
    directory: "/qa"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
